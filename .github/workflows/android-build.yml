name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Ensure Android SDK platform 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Android SDK 34 already installed on the runner"
          elif [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          else
            echo "sdkmanager not found; relying on the runner image" >&2
          fi

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -lh build-out/app/outputs/apk/debug/
          echo "APK_SHA256=$(sha256sum build-out/app/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ztv-launcher-debug
          path: build-out/app/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "### Z TV Launcher"
            echo ""
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| APK | \`app-debug.apk\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| SHA-256 | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
