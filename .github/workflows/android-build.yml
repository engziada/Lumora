name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Ensure Android SDK platform 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Android SDK 34 already installed"
          elif [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          else
            echo "sdkmanager not found; relying on the runner image" >&2
          fi

      - name: Lint debug
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee lint-output.log; then
            grep -E -m 9 '(^.*error:|FAILURE:|What went wrong|Execution failed|Caused by:)' lint-output.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -lh build-out/app/outputs/apk/debug/
          echo "APK_SHA256=$(sha256sum build-out/app/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ztv-launcher-debug
          path: build-out/app/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          echo "### Z TV Launcher" >> "$GITHUB_STEP_SUMMARY"
          echo "Debug APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
