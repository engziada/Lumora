plugins {
    id 'com.android.application'
}

android {
    namespace 'com.firestick.aura.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.firestick.aura.launcher'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '5.2.0'
        // Shown in Settings > About.
        resValue 'string', 'build_date', new java.text.SimpleDateFormat('yyyy-MM-dd').format(new Date())
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.leanback:leanback:1.0.0'

    // Local JVM tests. org.json replaces the android.jar stubs so JSON parsing runs for real.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
