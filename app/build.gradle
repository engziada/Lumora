plugins {
    id 'com.android.application'
}

// CI (main branch) provides the release keystore and the run number; local builds get neither.
def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def releaseKeystore = System.getenv('LUMORA_KEYSTORE_FILE')

android {
    namespace 'com.firestick.aura.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.firestick.aura.launcher'
        minSdk 26
        targetSdk 34
        testInstrumentationRunner 'com.firestick.aura.launcher.PreviewInstrumentation'
        // Every CI build is newer than the last, which the in-app updater relies on.
        // The 1100 base also advances beyond devices reporting legacy build 1085.
        versionCode ciRunNumber ? 1100 + ciRunNumber.toInteger() : 9
        versionName '5.4.1'
        // Shown in Settings > About.
        resValue 'string', 'build_date', new java.text.SimpleDateFormat('yyyy-MM-dd').format(new Date())
    }

    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('LUMORA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LUMORA_KEY_ALIAS')
                keyPassword System.getenv('LUMORA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.leanback:leanback:1.0.0'

    // Local JVM tests. org.json replaces the android.jar stubs so JSON parsing runs for real.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
